<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="6%" r="80%">
      <stop offset="0%" stop-color="#6f9fd6" stop-opacity="0.50"/>
      <stop offset="28%" stop-color="#2d4f7d" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89AACC"/>
      <stop offset="100%" stop-color="#4E85BF"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#08080a"/>
  <!-- cosmic bloom -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- tunnel rings -->
  <g fill="none" stroke="#8fb0d8" transform="translate(600 64)">
    <ellipse rx="150" ry="52" stroke-opacity="0.14"/>
    <ellipse rx="300" ry="108" stroke-opacity="0.10"/>
    <ellipse rx="470" ry="172" stroke-opacity="0.07"/>
    <ellipse rx="660" ry="246" stroke-opacity="0.045"/>
  </g>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="260" cy="150" r="0.9" opacity="0.35"/>
    <circle cx="360" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="520" cy="120" r="0.8" opacity="0.4"/>
    <circle cx="690" cy="60" r="1.0" opacity="0.55"/>
    <circle cx="840" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="960" cy="80" r="0.9" opacity="0.4"/>
    <circle cx="1070" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="80" cy="220" r="0.8" opacity="0.3"/>
    <circle cx="1130" cy="240" r="1.0" opacity="0.45"/>
    <circle cx="200" cy="300" r="0.7" opacity="0.3"/>
    <circle cx="1010" cy="320" r="0.8" opacity="0.35"/>
    <circle cx="430" cy="200" r="0.7" opacity="0.3"/>
    <circle cx="770" cy="210" r="0.8" opacity="0.35"/>
    <circle cx="600" cy="40" r="1.0" opacity="0.5"/>
  </g>

  <!-- bottom fade (atmospheric, behind content) -->
  <rect x="0" y="380" width="1200" height="250" fill="url(#bottomFade)"/>

  <!-- nav pill -->
  <g transform="translate(600 44)">
    <rect x="-186" y="-22" width="372" height="44" rx="22" fill="#141414" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.10"/>
    <!-- logo AA -->
    <circle cx="-160" cy="0" r="14" fill="url(#accent)"/>
    <circle cx="-160" cy="0" r="11" fill="#0a0a0a"/>
    <text x="-160" y="4" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#f5f5f5">AA</text>
    <!-- active Home -->
    <rect x="-132" y="-13" width="56" height="26" rx="13" fill="#ffffff" fill-opacity="0.06"/>
    <text x="-104" y="4" text-anchor="middle" font-size="13" fill="#f5f5f5">Home</text>
    <text x="-44" y="4" text-anchor="middle" font-size="13" fill="#8a8a8a">Work</text>
    <text x="18" y="4" text-anchor="middle" font-size="13" fill="#8a8a8a">Resume</text>
    <rect x="62" y="-11" width="2" height="22" fill="#2a2a2a"/>
    <text x="132" y="4" text-anchor="middle" font-size="13" fill="#f5f5f5">Say hi  ↗</text>
  </g>

  <!-- eyebrow -->
  <text x="600" y="258" text-anchor="middle" font-size="13" letter-spacing="5" fill="#8a8a8a">COLLECTION '26</text>

  <!-- name -->
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="98" letter-spacing="-1" fill="#f5f5f5">Arpit Agarwal</text>

  <!-- role line -->
  <text x="600" y="404" text-anchor="middle" font-size="23" fill="#8a8a8a">A <tspan font-family="Georgia, serif" font-style="italic" fill="#f5f5f5">Founder</tspan> lives in India.</text>

  <!-- tagline -->
  <text x="600" y="444" text-anchor="middle" font-size="16" fill="#7d7d7d">Mobile software engineer &amp; AI solution builder.</text>

  <!-- CTAs -->
  <g transform="translate(0 470)">
    <rect x="440" y="0" width="150" height="46" rx="23" fill="#f5f5f5"/>
    <text x="515" y="29" text-anchor="middle" font-size="15" fill="#0a0a0a">See Works</text>
    <rect x="610" y="0" width="150" height="46" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <text x="685" y="29" text-anchor="middle" font-size="15" fill="#f5f5f5">Reach out  ↗</text>
  </g>

  <!-- scroll cue -->
  <text x="600" y="582" text-anchor="middle" font-size="11" letter-spacing="3" fill="#6a6a6a">SCROLL</text>
  <rect x="599.5" y="592" width="1" height="22" fill="#3a3a3a"/>
</svg>
